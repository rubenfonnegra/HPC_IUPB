  <script>

    function loadHome() {
      document.getElementById("content").innerHTML = `
        <section class="hero">
          <p class="eyebrow">Hola! 👋</p>

          <h1>Curso High Performance Computing</h1>
          <h1>IUPB</h1>

          <h2>Arquitecturas paralelas, programación de alto rendimiento y cómputo para IA</h2>

          <p class="description">
            En este espacio encontrarás los contenidos del curso organizados por semanas: fundamentos de HPC, arquitecturas paralelas, programación concurrente, aceleración con GPU, optimización de código y aplicaciones de alto rendimiento para inteligencia artificial.
          </p>

          <div class="hero-actions">
            
            <a class="btn primary" href="https://github.com/rubenfonnegra/high_performance_computing" target="_blank">
              Ver repositorio
            </a>

            <a class="btn secondary" href="https://classroom.google.com/" target="_blank">
              Classroom
            </a>
            <a class="btn secondary" href="https://sicau.pascualbravo.edu.co/SICAU/Account/Login" target="_blank">
              SICAU
            </a>
          </div>
        </section>

        <section class="overview">
          <h2>🧭 ¿Cómo usar esta página?</h2>

          <div class="overview-grid">
            <div class="info-card">
              <h3>1. Lee las guías</h3>
              <p>Revisa la guía de cada semana antes de la sesión e identifica los conceptos, comandos y prácticas que se trabajarán.</p>
            </div>

            <div class="info-card">
              <h3>2. Mira los slides</h3>
              <p>Consulta las presentaciones para estudiar arquitecturas, modelos de paralelismo, optimización y casos de uso.</p>
            </div>

            <div class="info-card">
              <h3>3. Abre los notebooks</h3>
              <p>Ejecuta los notebooks y prácticas para medir rendimiento, paralelizar código y comparar estrategias de optimización.</p>
            </div>
          </div>
        </section>
      `;
    }

    function loadWeek({ title, mdFile, slidesURL, notebookURL, notebooks, spreadsheetURL, spreadsheetOpenURL }) {
        fetch(mdFile)
        .then(response => {
            if (!response.ok) {
            throw new Error("No se pudo cargar el Markdown");
            }
            return response.text();
        })
        .then(text => {

            const notebookList = notebooks || [
            {
                label: "Abrir Notebook",
                url: notebookURL
            }
            ];

            const notebookButtons = notebookList
            .filter(item => item && item.url)
            .map(item => `
                <a class="btn primary" href="${item.url}" target="_blank">
                💻 ${item.label}
                </a>
            `)
            .join("");

            const spreadsheetSection = spreadsheetURL ? `
            <section class="spreadsheet-section">
                <div class="section-title">
                <h2>📄 Spreadsheet</h2>
                <p> </p>
                </div>

                <div class="spreadsheet-frame-wrapper">
                <iframe 
                    class="spreadsheet-viewer"
                    src="${spreadsheetURL}">
                </iframe>
                </div>

                <div class="resource-buttons">
                <a class="btn secondary" href="${spreadsheetOpenURL}" target="_blank">
                    🔗 Abrir Spreadsheet
                </a>
                </div>
            </section>
            ` : "";
            
            const notebooksSection = notebookButtons ? `
            <section class="slides-section">

                <div class="section-title">
                    <h2>💻 Notebooks</h2>
                    <p>Material práctico de la semana.</p>
                </div>

                <div class="resource-buttons">
                    ${notebookButtons}
                </div>

            </section>
            ` : "";

            const slidesSection = slidesURL ? `
            <section class="slides-section">

                <div class="section-title">
                    <h2>📊 Presentación</h2>
                </div>

                <div class="slides-frame-wrapper">

                    <iframe
                        class="slides-viewer"
                        src="${slidesURL}"
                        allowfullscreen="true"
                        mozallowfullscreen="true"
                        webkitallowfullscreen="true">
                    </iframe>

                </div>

                <div class="resource-buttons">

                    <a class="btn secondary"
                      href="${slidesURL}"
                      target="_blank">

                        🔗 Abrir Slides

                    </a>

                </div>

                

            </section>
            ` : "";

            document.getElementById("content").innerHTML = `
            <section class="week-header">
                <span class="week-badge">📚 ${title}</span>
                <h1>${title}</h1>
                <p>Contenido, presentación, notebooks y recursos de trabajo.</p>
            </section>

            <section class="markdown-card">
                ${marked.parse(text)}
            </section>

            ${slidesSection}

            ${notebooksSection}

            ${spreadsheetSection}
            `;

            window.scrollTo(0, 0);
        })
        .catch(error => {
            document.getElementById("content").innerHTML = `
            <section class="error-card">
                <h2>⚠️ Error al cargar la semana</h2>
                <p>Revisa que el archivo exista en la ruta:</p>
                <code>${mdFile}</code>
            </section>
            `;
        });
    }
    
    function loadOnlyMD({ title, mdFile }) {
    fetch(mdFile)
      .then(response => {
        if (!response.ok) {
          throw new Error("No se pudo cargar el Markdown");
        }
        return response.text();
      })
      .then(text => {
        document.getElementById("content").innerHTML = `
          <section class="week-header">
            <span class="week-badge">📄 ${title}</span>
            <h1>${title}</h1>
            <p>Contenido cargado desde archivo Markdown.</p>
          </section>

          <section class="markdown-card">
            ${marked.parse(text)}
          </section>
        `;

        window.scrollTo(0, 0);
      })
      .catch(error => {
        document.getElementById("content").innerHTML = `
          <section class="error-card">
            <h2>⚠️ Error al cargar el contenido</h2>
            <p>Revisa que el archivo exista en la ruta:</p>
            <code>${mdFile}</code>
          </section>
        `;
      });
  }

    function loadContact() {

          <p><strong>Website:</strong> <a href="https://rubenfonnegra.github.io/" target="_blank">https://rubenfonnegra.github.io/</a></p>

            <a class="btn primary" href="mailto:ruben.fonnegra@pascualbravo.edu.co">Enviar email</a>
            <a class="btn secondary" href="https://github.com/rubenfonnegra" target="_blank">GitHub</a>
